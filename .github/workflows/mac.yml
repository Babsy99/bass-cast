name: mac

# Universal (arm64 + x86_64) BassCast.app + .dmg, ad-hoc signed; uses no repository secrets
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/**', 'shared/**', 'package.json', 'package-lock.json', '.github/workflows/mac.yml']

permissions:
  contents: write   # only for the prerelease (built-in GITHUB_TOKEN)

concurrency:
  group: mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    env:
      # Where the QR points: repo variable PAD_URL (not a secret), else the hosted controller page.
      VITE_PAD_URL: ${{ vars.PAD_URL || 'https://babsy99.github.io/bass-cast/' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: Restore icons (stored as base64 text in the repo)
        run: |
          set -euo pipefail
          mkdir -p app/src-tauri/icons
          for f in app/src-tauri/icons-b64/*.b64; do
            n="$(basename "$f" .b64)"
            base64 --decode -i "$f" -o "app/src-tauri/icons/$n"
          done
          ls -l app/src-tauri/icons

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build universal .app
        working-directory: app
        run: npx tauri build --target universal-apple-darwin --bundles app

      - name: Ad-hoc sign, verify, make DMG
        run: |
          set -euo pipefail
          APP="app/src-tauri/target/universal-apple-darwin/release/bundle/macos/BassCast.app"
          codesign --force --deep -s - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          for b in "$APP"/Contents/MacOS/*; do lipo -info "$b"; done
          mkdir -p out/dmgroot
          ditto "$APP" out/dmgroot/BassCast.app
          ln -s /Applications out/dmgroot/Applications
          hdiutil create -volname BassCast -srcfolder out/dmgroot -ov -format UDZO out/BassCast-universal.dmg
          codesign --force -s - out/BassCast-universal.dmg
          # Recommended download: a zip made with ditto --keepParent (keeps the bundle, symlinks and the
          # ad-hoc signature intact; Finder's own "Compress" or `zip -r` can break the signature).
          ditto -c -k --keepParent "$APP" out/BassCast.zip
          # sanity: unzip with ditto and re-verify the signature survived
          mkdir -p out/zipcheck && ditto -x -k out/BassCast.zip out/zipcheck
          codesign --verify --deep --strict --verbose=2 out/zipcheck/BassCast.app
          rm -rf out/zipcheck
          shasum -a 256 out/BassCast.zip out/BassCast-universal.dmg | tee out/SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BassCast-universal-${{ github.run_number }}
          path: |
            out/BassCast.zip
            out/BassCast-universal.dmg
            out/SHA256SUMS.txt
          if-no-files-found: error

      - name: Public prerelease v0.1.1-m0.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v0.1.1-m0.1"
          FILES="out/BassCast.zip out/BassCast-universal.dmg out/SHA256SUMS.txt"
          NOTES="Bass Cast spike M0.1 test build (casting fix). Universal (Apple silicon + Intel), ad-hoc signed, not notarized.
          Recommended download: BassCast.zip. Double-click it, drag BassCast.app to Applications, then paste this in Terminal once:
            xattr -dr com.apple.quarantine /Applications/BassCast.app && open /Applications/BassCast.app
          (Without Terminal: open the app once, then System Settings > Privacy & Security > Open Anyway.)
          The .dmg is the same app. Controller page: https://babsy99.github.io/bass-cast/
          Allow the Local Network prompt for direct Wi-Fi play.
          Built from ${GITHUB_SHA} by run ${GITHUB_RUN_ID}."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete-asset "$TAG" BassCast-universal.app.zip -y 2>/dev/null || true  # renamed to BassCast.zip
            gh release upload "$TAG" $FILES --clobber
            gh release edit "$TAG" --prerelease --draft=false --notes "$NOTES"
          else
            gh release create "$TAG" $FILES --prerelease --target "$GITHUB_SHA" --title "BassCast spike v0.1.1-m0.1 (M0.1 casting fix)" --notes "$NOTES"
          fi
