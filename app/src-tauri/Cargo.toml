[package]
name = "basscast"
version = "0.1.0"
description = "Bass Cast spike - Mac game host (phone is the controller)"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "basscast_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
